name: Build and Deploy to Server

on:
  push:
    branches:
      - main  # Trigger only on push to the main branch
  pull_request:
    branches:
      - main  # Trigger on PR to main branch

jobs:
  build:
    runs-on: ubuntu-latest

    # services:
    #   mongo:
    #     image: mongo:latest
    #     ports:
    #       - 27017:27017
    #     options: --health-cmd="curl --silent --show-error --fail http://localhost:27017/" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v2

    # # Step 2: Set up Docker Buildx
    # - name: Set up Docker Buildx
    #   uses: docker/setup-buildx-action@v1

    # # Step 3: Log in to Docker Hub
    # - name: Log in to Docker Hub
    #   uses: docker/login-action@v2
    #   with:
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_PASSWORD }}

    # # Step 4: Build and push frontend Docker image
    # - name: Build and push frontend Docker image
    #   run: |
    #     docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend
    #     docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

    # # Step 5: Build and push backend Docker image
    # - name: Build and push backend Docker image
    #   run: |
    #     docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:latest ./backend
    #     docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build  # This ensures deployment happens after build
    steps:
    # Step 1: Set up SSH for secure connection to the server
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # Step 2: Deploy to the server (git pull and docker-compose up)
    - name: Deploy to Server
      run: |
        ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_IP }} << 'EOF'
          # Navigate to the project directory
          cd /opt/node-react-project

          # Pull the latest changes from GitHub
          git pull origin main

          # Optionally, you can install dependencies (if needed)
          # npm install --prefix ./backend
          # npm install --prefix ./frontend

          # Stop and remove existing containers, then restart the services
          docker-compose down
          docker-compose up --build -d
        EOF
